version: '3.8'

services:
  tola-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tola-travel-packing-app
    ports:
      - "8080:8080"
    volumes:
      - ./data:/code/data
      - ./logs:/code/logs
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
